<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04101d">
  <meta name="color-scheme" content="dark">
  <title>电路实验室 · Circuit Lab</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="电路实验室">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a5 5 0 0 1 5 5v1"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 7 5 5-5 5"/><path d="M20 12h-9a5 5 0 0 0-5 5v1"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10v4h3l4 3V7L8 10H5Z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10v4h3l4 3V7L8 10H5Z"/><path d="m16 10 4 4m0-4-4 4"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2-2.4 3.6"/><path d="M12 17.2h.01"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 10 4 4 4-4"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 12 8-6 1.5L9.5 19 6 3Z"/></symbol>
    <symbol id="i-wire" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h4a3 3 0 0 1 3 3v6a3 3 0 0 0 3 3"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 15 8-10 8 6-7 9H8l-4-5Z"/><path d="m11 19 5-6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8L7 4Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M16 4v16"/></symbol>
    <symbol id="i-step" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16l10-8L6 4Z"/><path d="M19 4v16"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M4 14h16M10 4v16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/></symbol>
    <symbol id="i-chapter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h6v14H5zM13 5h6v14h-6z"/><path d="M8 9h.01M16 9h.01"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 14h6l-1 8 9-13h-6l0-7Z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  </svg>

  <div id="boot">
    <div class="boot-logo">
      <svg viewBox="0 0 60 60" class="lambda-logo"><path d="M8 12h44" /><path d="M15 49 30 18l15 31" /></svg>
    </div>
    <div class="boot-word">CIRCUIT <b>LAB</b></div>
    <div class="boot-sub">逻辑电路实验室</div>
    <div class="boot-bar"><i></i></div>
  </div>

  <div id="app" class="app">
    <header id="topbar" class="topbar">
      <button id="paletteToggle" class="icon-btn palette-toggle" aria-label="显示或隐藏元件库">
        <svg><use href="#i-grid"/></svg>
      </button>
      <div class="brand">
        <svg viewBox="0 0 44 44" class="brand-mark" aria-hidden="true"><path d="M7 10h30"/><path d="M12 36 22 14l10 22"/></svg>
        <div class="brand-copy">
          <div class="brand-title">CIRCUIT <b>LAB</b></div>
          <div class="brand-sub">逻辑电路实验室</div>
        </div>
      </div>
      <button id="levelPill" class="level-pill">
        <span class="level-dot"></span>
        <span id="levelPillText">自由沙盒</span>
        <svg><use href="#i-chevron"/></svg>
      </button>
      <div class="top-spacer"></div>
      <button id="undoBtn" class="icon-btn" aria-label="撤销"><svg><use href="#i-undo"/></svg></button>
      <button id="redoBtn" class="icon-btn" aria-label="重做"><svg><use href="#i-redo"/></svg></button>
      <button id="soundBtn" class="icon-btn" aria-label="音效"><svg><use href="#i-sound"/></svg></button>
      <button id="helpBtn" class="icon-btn" aria-label="玩法说明"><svg><use href="#i-help"/></svg></button>
      <button id="menuBtn" class="icon-btn menu-btn" aria-label="菜单"><svg><use href="#i-menu"/></svg></button>
    </header>

    <aside id="palette" class="palette">
      <div class="palette-head">
        <div>
          <div class="eyebrow">COMPONENTS</div>
          <h2>元件库</h2>
        </div>
        <button id="paletteClose" class="icon-btn small" aria-label="收起元件库"><svg><use href="#i-close"/></svg></button>
      </div>
      <div id="paletteList" class="palette-list"></div>
      <div class="palette-foot">
        <span class="foot-dot"></span>
        <span>点击放入画布</span>
      </div>
    </aside>

    <main id="stage" class="stage">
      <canvas id="board" aria-label="电路画布"></canvas>

      <div id="emptyHint" class="empty-hint">
        <div class="empty-graphic">
          <span class="empty-pin a"></span>
          <span class="empty-wire"></span>
          <span class="empty-pin b"></span>
        </div>
        <div class="empty-title">从一枚开关开始</div>
        <div class="empty-copy">点左上角的元件库，把开关放进画布。<br>再拖一根线，把信号接给下一枚元件。</div>
      </div>

      <div id="goalCard" class="goal-card hidden">
        <div class="goal-head">
          <div>
            <div id="goalEyebrow" class="eyebrow">LEVEL 01</div>
            <h2 id="goalTitle">第一束光</h2>
          </div>
          <button id="goalToggle" class="icon-btn small" aria-label="收起目标"><svg><use href="#i-chevron"/></svg></button>
        </div>
        <div id="goalBody" class="goal-body">
          <p id="goalObjective"></p>
          <div id="goalTable" class="mini-table-wrap"></div>
          <div class="goal-actions">
            <button id="goalLesson" class="goal-lesson" title="查看本关介绍"><svg><use href="#i-help"/></svg>介绍</button>
            <button id="goalCheck" class="goal-check"><svg><use href="#i-check"/></svg>验证电路</button>
          </div>
        </div>
      </div>

      <div id="monitor" class="monitor hidden"></div>

      <div class="canvas-tools">
        <button id="zoomIn" class="icon-btn tiny" aria-label="放大"><svg><use href="#i-plus"/></svg></button>
        <button id="zoomOut" class="icon-btn tiny" aria-label="缩小"><svg><use href="#i-minus"/></svg></button>
        <button id="fitView" class="icon-btn tiny" aria-label="适应画布" title="适应画布"><svg><use href="#i-fit"/></svg></button>
      </div>

      <div id="toast" class="toast" role="status"></div>
      <div id="fxLayer" class="fx-layer"></div>
    </main>

    <footer id="toolbar" class="toolbar">
      <div class="tool-group" role="group" aria-label="工具">
        <button class="tool-btn active" data-tool="select" aria-label="选择与移动"><svg><use href="#i-pointer"/></svg><span>选择</span></button>
        <button class="tool-btn" data-tool="wire" aria-label="连线模式"><svg><use href="#i-wire"/></svg><span>连线</span></button>
        <button class="tool-btn" data-tool="erase" aria-label="删除模式"><svg><use href="#i-eraser"/></svg><span>剪刀</span></button>
      </div>

      <div class="run-group">
        <button id="runBtn" class="run-btn running" aria-label="暂停或运行">
          <svg><use href="#i-pause"/></svg>
          <span>运行中</span>
        </button>
        <button id="stepBtn" class="icon-btn step-btn" aria-label="单步时钟" title="单步时钟：0 → 1 → 0"><svg><use href="#i-step"/></svg></button>
      </div>

      <div class="toolbar-spacer"></div>

      <button id="deleteBtn" class="delete-btn hidden"><svg><use href="#i-trash"/></svg><span>删除</span></button>
      <button id="truthBtn" class="result-btn"><svg><use href="#i-table"/></svg><span>真值表</span></button>
      <button id="checkBtn" class="result-btn primary"><svg><use href="#i-check"/></svg><span>验证</span></button>
    </footer>
  </div>

  <div id="scrim" class="scrim hidden"></div>
  <div id="sheetWrap" class="sheet-wrap hidden" aria-hidden="true">
    <section id="sheet" class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <header id="sheetHead" class="sheet-head">
        <div>
          <div id="sheetEyebrow" class="eyebrow">RESULTS</div>
          <h2 id="sheetTitle">真值表</h2>
        </div>
        <button id="sheetClose" class="icon-btn" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
      </header>
      <div id="sheetBody" class="sheet-body"></div>
      <footer id="sheetFoot" class="sheet-foot"></footer>
    </section>
  </div>

  <div id="modalWrap" class="modal-wrap hidden" aria-hidden="true">
    <section id="modal" class="modal" role="dialog" aria-modal="true"></section>
  </div>

  <script src="defs.js"></script>
  <script src="levels.js"></script>
  <script src="engine.js"></script>
  <script src="ui.js"></script>
  <script>
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
